# ==============================================================================
# DigitalOcean App Platform Specification
# https://docs.digitalocean.com/products/app-platform/reference/app-spec/
# ==============================================================================

name: library-demand-predictor
region: blr # Bangalore datacenter (ideal for Asia/Kolkata timezone). Options: blr, nyc, ams, fra, sgp

services:
  - name: web
    dockerfile_path: Dockerfile
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs # $5.00/month (512MB RAM, 1 vCPU)
    health_check:
      http_path: /api/health
      initial_delay_seconds: 15
      period_seconds: 20
      timeout_seconds: 5
      failure_threshold: 3
    routes:
      - path: /
    envs:
      - key: PORT
        value: "8000"
        scope: RUN_TIME
      - key: HOST
        value: "0.0.0.0"
        scope: RUN_TIME
      - key: CLOUD_PROVIDER
        value: "DigitalOcean"
        scope: RUN_TIME
      - key: DO_REGION
        value: "blr1"
        scope: RUN_TIME
      - key: APP_TIMEZONE
        value: "Asia/Kolkata"
        scope: RUN_TIME
      - key: ADMIN_API_KEY
        value: "library-admin-secret-key-2026"
        scope: RUN_TIME
        type: SECRET
